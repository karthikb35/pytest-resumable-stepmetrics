[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-resumable-stepmetrics"
version = "0.1.2"
description = "Structured step-level metadata, retry/attempt tracking, and resume-on-retry for pytest — with a pluggable custom-record extension system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "pytest-resumable-stepmetrics contributors" }]
keywords = ["pytest", "plugin", "steps", "retry", "resume", "metadata", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/karthikb35/pytest-resumable-stepmetrics"
Repository = "https://github.com/karthikb35/pytest-resumable-stepmetrics"
Issues = "https://github.com/karthikb35/pytest-resumable-stepmetrics/issues"
Changelog = "https://github.com/karthikb35/pytest-resumable-stepmetrics/blob/main/CHANGELOG.md"

# Register the plugin with pytest.
[project.entry-points.pytest11]
steplog = "pytest_resumable_stepmetrics.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_resumable_stepmetrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
